worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─────────────────────────────────────────────────────────
    # Performance — Optimizado para servir assets estáticos
    # desde un HDD (sendfile + buffers grandes)
    # ─────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Buffers más grandes para compensar la latencia del HDD
    output_buffers 4 256k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    # Compresión para SWFs y assets de texto
    gzip on;
    gzip_types
        application/x-shockwave-flash
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;
    gzip_min_length 1024;

    # ─────────────────────────────────────────────────────────
    # Cache Control — Los clientes cachean assets localmente
    # ─────────────────────────────────────────────────────────
    map $sent_http_content_type $cache_control {
        default                         "public, max-age=3600";
        application/x-shockwave-flash   "public, max-age=86400";
        image/png                       "public, max-age=86400";
        image/jpeg                      "public, max-age=86400";
        audio/mpeg                      "public, max-age=86400";
    }

    # ═════════════════════════════════════════════════════════
    # SERVIDOR: Media Houdini (AS2/AS3)
    # Los archivos se sirven desde /var/www/media/houdini
    # que es un bind-mount del HDD externo
    # ═════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name media.localhost media.test;

        # Crossdomain para Flash
        location /crossdomain.xml {
            default_type text/xml;
            return 200 '<?xml version="1.0"?>
<!DOCTYPE cross-domain-policy SYSTEM "http://www.adobe.com/xml/dtds/cross-domain-policy.dtd">
<cross-domain-policy>
    <allow-access-from domain="*" />
</cross-domain-policy>';
        }

        # Media AS3 (Houdini)
        location /houdini/ {
            alias /var/www/media/houdini/;
            add_header Cache-Control $cache_control;
            add_header Access-Control-Allow-Origin *;

            # Intentar servir archivo, luego directorio, luego 404
            try_files $uri $uri/ =404;
        }

        # Media AS2 (Timeline)
        location /timeline/ {
            alias /var/www/media/timeline/;
            add_header Cache-Control $cache_control;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ =404;
        }

        # Assets OpenCPI
        location /opencpi/ {
            alias /var/www/media/opencpi/;
            add_header Cache-Control $cache_control;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ =404;
        }

        # Proxy a Dash Web Services
        location /api/ {
            proxy_pass http://dash:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Raíz genérica — sirve Houdini por defecto
        location / {
            root /var/www/media/houdini;
            add_header Cache-Control $cache_control;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ =404;
        }
    }

    # ═════════════════════════════════════════════════════════
    # SERVIDOR: Play (cliente del juego)
    # ═════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name play.localhost play.test;

        location / {
            root /var/www/media/houdini/play;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ =404;
        }

        location /crossdomain.xml {
            default_type text/xml;
            return 200 '<?xml version="1.0"?>
<!DOCTYPE cross-domain-policy SYSTEM "http://www.adobe.com/xml/dtds/cross-domain-policy.dtd">
<cross-domain-policy>
    <allow-access-from domain="*" />
</cross-domain-policy>';
        }
    }
}
